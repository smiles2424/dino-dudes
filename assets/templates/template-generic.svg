<text x="7" y="28" font-family="Helvetica, Arial, sans-serif" font-size="3.2" fill="#333333">1. Draw inside the dashed box. Keep the four corner squares clean and unmarked.</text>
<text x="7" y="33" font-family="Helvetica, Arial, sans-serif" font-size="3.2" fill="#333333">2. Photograph the whole sheet flat, in even light, with all four corner squares visible.</text>
<text x="7" y="38" font-family="Helvetica, Arial, sans-serif" font-size="3.2" fill="#333333">3. Upload it in the app - your drawing wraps onto your dinosaur in the shared world.</text>
