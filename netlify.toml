# Netlify — the web client, a plain Vite static build with no server, functions
# or runtime config.
#
# Everything it knows about the backend is baked in at BUILD time by
# `VITE_API_URL` (and optionally `VITE_WS_URL`), which is the thing that
# surprises people: changing the server URL means a rebuild with the cache
# cleared, not a restart. The Vercel equivalent is in docs/DEPLOY.md.

[build]
  # The repo root — this is a pnpm workspace and @dino/web depends on
  # @dino/shared and @dino/pipeline by workspace link, so a site "base" of
  # apps/web would not install.
  base = "."
  command = "pnpm install --frozen-lockfile && pnpm --filter @dino/web... build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"
  # Netlify enables corepack when this is set, which pins the pnpm from the
  # root package.json's `packageManager` field.
  NETLIFY_USE_PNPM = "true"

# ── SPA routing ───────────────────────────────────────────────────────────────
# There is no router library — `main.tsx` reads `window.location.pathname` — so
# the host must hand the same index.html to every path or the QR-code deep links
# break, and those are the entire product. 200 (rewrite) not 301, because the URL
# the phone shows has to keep its query string. Netlify serves real files first,
# so /assets/* and /debug/* are unaffected.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── Caching ───────────────────────────────────────────────────────────────────
# Thirty phones open this site inside two minutes, and Vite content-hashes
# everything under /assets — including the ~843 kB `three` chunk, which the
# second class then never downloads again.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# index.html is the only mutable entry point and must never be cached, or a
# redeploy leaves phones pointing at asset hashes that no longer exist.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The world harness's fixtures are not content-hashed.
[[headers]]
  for = "/debug/*"
  [headers.values]
    Cache-Control = "public, max-age=300"
